<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #C05640; color: #F7F5F0; font-family: 'Noto Sans JP', sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; padding: 60px; position: relative; }
    .content { max-width: 900px; }
    h1 { font-family: 'Noto Serif JP', serif; font-size: 56px; margin-bottom: 30px; }
    p { font-size: 24px; line-height: 1.6; color: rgba(247, 245, 240, 0.9); }
    .footer { position: absolute; bottom: 40px; left: 60px; right: 60px; display: flex; justify-content: space-between; font-size: 14px; color: rgba(247, 245, 240, 0.6); }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="content">
      <h1>Crescer com Coerência</h1>
      <p>Provar valor antes de escalar, medir retorno antes de investir e garantir segurança antes de expandir. O próximo passo do PetCuida é o piloto local em Belo Horizonte.</p>
    </div>
    <div class="footer">
      <span>Startup PetCuida · PUC Minas 2026</span>
      <span>Atividade XIII · 07</span>
    </div>
  </div>
</body>
</html>
